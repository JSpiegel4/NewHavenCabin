name: Convert images to WebP

on:
  push:
    branches: [ main ]
    paths:
      - '**.png'
      - '**.jpg'
      - '**.jpeg'

# Allow the workflow to push generated files using the provided GITHUB_TOKEN
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert PNG/JPG to WebP
        run: |
          # create webp files next to originals
          for f in *.png *.jpg *.jpeg; do
            [ -f "$f" ] || continue
            # Skip if WebP already exists and is newer
            webp_file="${f%.*}.webp"
            if [ -f "$webp_file" ] && [ "$webp_file" -nt "$f" ]; then
              echo "Skipping $f - WebP is up to date"
              continue
            fi
            if command -v cwebp >/dev/null 2>&1; then
              echo "Converting $f to WebP..."
              cwebp -q 85 "$f" -o "$webp_file"
            fi
          done

      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all "*.webp" || true
          git diff --staged --quiet || (git commit -m "chore: add/update webp images" && git push origin HEAD:main)
